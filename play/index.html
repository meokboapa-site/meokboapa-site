<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>먹보 아빠 쇼츠</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:12px max(14px,env(safe-area-inset-left)) 12px max(14px,env(safe-area-inset-right));z-index:2}
.top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:700;font-family:inherit}
.top span{font-size:13px;color:rgba(255,255,255,.7)}
.box{position:absolute;inset:60px 0 env(safe-area-inset-bottom) 0;display:flex;align-items:center;justify-content:center;padding:0 12px}
iframe{border:0;height:100%;max-height:calc((100vw - 24px)*16/9);aspect-ratio:9/16;max-width:100%;border-radius:14px;background:#000}
.err{font-size:14px;color:rgba(255,255,255,.75);text-align:center;line-height:1.6}
</style></head>
<body>
<div class="top"><button type="button" id="cl">‹ 닫기</button><span>먹보 아빠 쇼츠</span></div>
<div class="box" id="box"></div>
<script>
(function(){
  var id = (new URLSearchParams(location.search).get('v') || '');
  var box = document.getElementById('box');
  if(/^[A-Za-z0-9_-]{6,20}$/.test(id)){
    var f = document.createElement('iframe');
    f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&playsinline=1&rel=0';
    f.allow = 'autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen = true; f.title = '먹보 아빠 쇼츠';
    box.appendChild(f);
  } else { box.innerHTML = '<p class="err">영상을 찾지 못했어요.</p>'; }
  document.getElementById('cl').addEventListener('click', function(){
    if(window.parent !== window){ try{ window.parent.postMessage({mb:'close'}, '*'); return; }catch(e){} }
    if(history.length > 1) history.back(); else location.href = '/';
  });
})();
</script>
</body></html>
