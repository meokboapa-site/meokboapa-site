<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>send</title>
<p id="s">보내는 중…</p>
<script>
(async function(){
  var names=['01_home.png','02_dogam.png','03_recipes.png','04_bantaegi.png','05_care.png','06_alerts.png'], files=[];
  for(var i=0;i<names.length;i++){ var r=await fetch('/_asc/'+names[i]+'?v='+Date.now()); files.push(new File([await r.blob()],names[i],{type:'image/png'})); }
  var T=window.opener||(window.parent!==window?window.parent:null); if(T){ T.postMessage({mbAsc:files},'https://appstoreconnect.apple.com'); document.getElementById('s').textContent='보냄 '+files.length; setTimeout(function(){window.close();},1500); }
  else document.getElementById('s').textContent='opener 없음';
})();
</script>
